# ---------------------------------------------------------------------------
# Jewellery Shop ERP - base configuration.
# Environment-specific values live in application-dev.yml / application-prod.yml.
# No secret may be hardcoded here; every sensitive value is an env placeholder.
# ---------------------------------------------------------------------------
spring:
  application:
    name: jewellery-erp
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jewellery_erp}
    username: ${DB_USERNAME:jewellery}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: jewellery-erp-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000

  jpa:
    # Schema ownership belongs to Flyway. Hibernate only verifies that the
    # mapped model matches the migrated schema - it never mutates it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    context-path: /
  compression:
    enabled: true

# --- Application-specific configuration ------------------------------------
app:
  jwt:
    # 256-bit (or longer) Base64-encoded secret. MUST be supplied via env.
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:jewellery-erp}
    access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:PT15M}
    refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:P7D}
  # Every business date - invoice dates, report ranges, financial years - is
  # resolved in the shop's own time zone. The database stores UTC instants, so
  # without this a sale rung up at 00:30 IST would land on the previous day.
  business-timezone: ${BUSINESS_TIMEZONE:Asia/Kolkata}
  old-metal:
    # Item type codes that may be bought back as old metal. Configuration rather
    # than a column on item_types, so adding platinum later needs no migration.
    item-type-codes: ${OLD_METAL_ITEM_TYPE_CODES:GOLD,SILV}
  reports:
    # Upper bound on a report's date range - protects the server from an
    # accidental ten-year export on a busy shop's data.
    max-range-days: ${REPORT_MAX_RANGE_DAYS:366}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,X-Requested-With
    # Lets the browser read the filename of a downloaded Excel report.
    exposed-headers: Content-Disposition
    allow-credentials: false
    max-age: 3600
  bootstrap:
    admin:
      enabled: ${INITIAL_ADMIN_ENABLED:true}
      username: ${INITIAL_ADMIN_USERNAME:}
      password: ${INITIAL_ADMIN_PASSWORD:}
      email: ${INITIAL_ADMIN_EMAIL:}
      full-name: ${INITIAL_ADMIN_FULL_NAME:System Administrator}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.jewellery.erp: INFO
    org.springframework.security: INFO
